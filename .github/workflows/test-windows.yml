name: Test on Windows

on:
  workflow_dispatch:

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: yarn

      - run: yarn install --frozen-lockfile
        id: npm-install

      - run: npm run lint
        if: steps.npm-install.conclusion == 'success' && (success() || failure())

      - run: npm run test
        if: steps.npm-install.conclusion == 'success' && (success() || failure())

      - run: npm run build
        if: steps.npm-install.conclusion == 'success' && (success() || failure())

  notify-failure:
    needs: deploy
    if: failure() && needs.deploy.result == 'failure' && github.ref_name == 'main'
    runs-on: ubuntu-latest
    steps:
      - uses: fullstackhouse/slack-notify-action@v1
        with:
          bot-token: ${{ secrets.FSH_SLACK_BOT_TOKEN }}
          channel: "#fsh-alerts"
          title: "plasmic-utils — Windows tests failed"
          message: "Run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          status: failure
